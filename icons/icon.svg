<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Reading Log icon: a colourful wheel with a pointer, on coral. -->
  <rect width="100" height="100" rx="22" fill="#FF6B6B"/>
  <circle cx="50" cy="54" r="34" fill="#FFFFFF"/>
  <g transform="translate(50 54)" stroke="#2D2A4A" stroke-width="1.6" stroke-linejoin="round">
    <!-- six slices of radius 30.5, starting at the top-left -->
    <path d="M0 0 L-15.25 -26.41 A30.5 30.5 0 0 1 15.25 -26.41 Z" fill="#FFC93C"/>
    <path d="M0 0 L15.25 -26.41 A30.5 30.5 0 0 1 30.5 0 Z" fill="#1FB5A8"/>
    <path d="M0 0 L30.5 0 A30.5 30.5 0 0 1 15.25 26.41 Z" fill="#8E6CEF"/>
    <path d="M0 0 L15.25 26.41 A30.5 30.5 0 0 1 -15.25 26.41 Z" fill="#4D9DE0"/>
    <path d="M0 0 L-15.25 26.41 A30.5 30.5 0 0 1 -30.5 0 Z" fill="#F78FB3"/>
    <path d="M0 0 L-30.5 0 A30.5 30.5 0 0 1 -15.25 -26.41 Z" fill="#FF9F43"/>
  </g>
  <circle cx="50" cy="54" r="7.5" fill="#2D2A4A"/>
  <circle cx="50" cy="54" r="3" fill="#FFFFFF"/>
  <path d="M43 12.5 H57 L50 26 Z" fill="#2D2A4A" stroke="#2D2A4A" stroke-width="1" stroke-linejoin="round"/>
</svg>
